name: ZenCards
options:
  bundleIdPrefix: com.zencards
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs
    from: 5.0.0

targets:
  ZenCards:
    type: application
    platform: iOS
    sources:
      - path: ZenCards
        name: ZenCards
        excludes:
          - "*.md"
    dependencies:
      - package: FSRS
      - target: ZenCardsWidget
    settings:
      base:
        PRODUCT_NAME: ZenCards
        PRODUCT_BUNDLE_IDENTIFIER: com.zencards.app
        CODE_SIGN_ENTITLEMENTS: ZenCards/ZenCards.entitlements
        INFOPLIST_FILE: ZenCards/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ZenCardsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ZenCardsWidget
        name: ZenCardsWidget
        excludes:
          - "*.md"
      - path: ZenCards/Models
        name: Models (Shared)
      - path: ZenCards/Services/FSRSService.swift
        name: FSRSService (Shared)
      - path: ZenCards/Extensions/Color+Hex.swift
        name: Color+Hex (Shared)
    dependencies:
      - package: FSRS
    settings:
      base:
        PRODUCT_NAME: ZenCardsWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.zencards.app.widget
        CODE_SIGN_ENTITLEMENTS: ZenCardsWidget/ZenCardsWidget.entitlements
        INFOPLIST_FILE: ZenCardsWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.9"

schemes:
  ZenCards:
    build:
      targets:
        ZenCards: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
